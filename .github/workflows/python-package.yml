name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build VerCOR and plugin evidence once
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
          python -m build --wheel --outdir dist tests/fixtures/public_plugin
          python -m build --wheel --outdir dist tests/fixtures/public_plugin_0_3
      - uses: actions/upload-artifact@v4
        with:
          name: vercor-distributions
          path: dist/

  installed-artifact-tests:
    needs: build-artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        environment: [base, jcm, veros]
        artifact: [wheel]
        include:
          - environment: base
            extra: ""
            pytest-target: >-
              tests/test_setup_boundaries.py::test_public_import_and_config_access_are_optional_dependency_free
              tests/test_setup_boundaries.py::test_lazy_factory_attribute_access_loads_only_lightweight_factory_module
              tests/test_setup_boundaries.py::test_vercor_setups_is_the_only_setup_lazy_export_registry
              tests/test_setup_boundaries.py::test_missing_optional_dependencies_fail_at_factory_invocation
              tests/test_setup_boundaries.py::test_camulator_enabled_spinup_fails_before_runtime_configuration
              tests/test_setup_boundaries.py::test_setup_subprocess_helpers_honor_installed_package_root
              tests/test_distribution_boundaries.py
          - environment: jcm
            extra: "[jcm]"
            pytest-target: >-
              tests/test_setup_lifecycle_helpers.py::test_make_jcm_land_atmosphere_replaces_only_missing_forcing
              tests/test_external_components_coverage.py::test_jax_gcm_initialize_uses_provided_forcing_and_can_spin_up
              tests/test_external_components_coverage.py::test_jax_gcm_initialize_builds_default_forcing_when_missing
          - environment: veros
            extra: "[veros]"
            pytest-target: >-
              tests/test_setup_boundaries.py::test_veros_implementation_import_does_not_configure_runtime
              tests/test_setup_boundaries.py::test_veros_factory_configures_once_before_implementation_import
              tests/test_external_components_coverage.py::test_veros_initialize_spinup_follows_enabled_only
          - python-version: "3.12"
            environment: base
            artifact: sdist
            extra: ""
            pytest-target: >-
              tests/test_distribution_boundaries.py::test_built_sdist_installs_and_imports_outside_checkout
          - python-version: "3.13"
            environment: base
            artifact: sdist
            extra: ""
            pytest-target: >-
              tests/test_distribution_boundaries.py::test_built_sdist_installs_and_imports_outside_checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: vercor-distributions
          path: dist/
      - name: Install selected artifact environment
        run: |
          python -m pip install --upgrade pip pytest mypy pyyaml build "flit_core<4"
          WHEEL_PATH="${GITHUB_WORKSPACE}/dist/vercor-0.4.0a1-py3-none-any.whl"
          SDIST_PATH="${GITHUB_WORKSPACE}/dist/vercor-0.4.0a1.tar.gz"
          if [ "${{ matrix.artifact }}" = "sdist" ]; then
            ARTIFACT_PATH="${SDIST_PATH}"
          else
            ARTIFACT_PATH="${WHEEL_PATH}"
          fi
          python -m pip install "${ARTIFACT_PATH}${{ matrix.extra }}"
          PACKAGE_ROOT=$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          echo "VERCOR_ARTIFACT_DIR=${GITHUB_WORKSPACE}/dist" >> "$GITHUB_ENV"
          echo "VERCOR_TEST_PACKAGE_ROOT=${PACKAGE_ROOT}" >> "$GITHUB_ENV"
      - name: Verify imports resolve from the installed artifact
        run: |
          cd "$RUNNER_TEMP"
          python -c "import pathlib, vercor; assert pathlib.Path(vercor.__file__).is_relative_to(pathlib.Path('${VERCOR_TEST_PACKAGE_ROOT}'))"
      - name: Run relevant installed-artifact suite
        env:
          PYTHONSAFEPATH: "1"
        run: python -P -m pytest --import-mode=importlib ${{ matrix.pytest-target }} -q --tb=short

  plugin-contract-tests:
    needs: build-artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        plugin-lane: [native-v0.4, historical-v0.3-artifact]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: vercor-distributions
          path: dist/
      - name: Run installed native v0.4 plugin
        if: matrix.plugin-lane == 'native-v0.4'
        run: |
          python -m pip install --upgrade pip mypy
          python -m pip install "${GITHUB_WORKSPACE}/dist/vercor-0.4.0a1-py3-none-any.whl"
          python -m pip install --no-deps "${GITHUB_WORKSPACE}/dist/vercor_public_plugin-0.1.0-py3-none-any.whl"
          PACKAGE_ROOT=$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          cd "$RUNNER_TEMP"
          python -m vercor_public_plugin.smoke --output-dir "$RUNNER_TEMP/plugin-output"
          cp "$GITHUB_WORKSPACE/tests/fixtures/public_plugin/use_site.py" public_plugin_use_site.py
          MYPYPATH="$PACKAGE_ROOT" mypy --strict "$PACKAGE_ROOT/vercor_public_plugin" public_plugin_use_site.py
      - name: Inspect frozen v0.3 historical artifact
        if: matrix.plugin-lane == 'historical-v0.3-artifact'
        run: |
          python -c "import zipfile; p='dist/vercor_compat_plugin_0_3-0.1.0-py3-none-any.whl'; z=zipfile.ZipFile(p); m=z.read(next(n for n in z.namelist() if n.endswith('.dist-info/METADATA'))).decode(); assert 'Requires-Dist: vercor>=0.3,<0.4' in m"

  macos-smoke:
    needs: build-artifacts
    runs-on: macos-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: vercor-distributions
          path: dist/
      - name: Run installed macOS public smoke
        run: |
          python -m pip install "dist/vercor-0.4.0a1-py3-none-any.whl"
          python -m pip install --no-deps "dist/vercor_public_plugin-0.1.0-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          python -m vercor_public_plugin.smoke --output-dir "$RUNNER_TEMP/plugin-output"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality and optional-model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,jcm,veros]"
      - name: Check formatting
        run: python -m black --check vercor examples tests
      - name: Run strict lint
        run: python -m flake8 . --count --max-line-length=120 --statistics
      - name: Run static type checks
        run: python -m mypy vercor examples tests
      - name: Compile Python sources
        run: python -m compileall -q vercor examples tests
      - name: Run full test suite
        run: python -m pytest tests/ -q --tb=short
      - name: Enforce branch coverage
        run: >-
          python -m pytest tests/ -q --tb=short --cov=vercor --cov-branch
          --cov-report=term-missing --cov-fail-under=90
