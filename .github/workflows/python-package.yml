name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist once
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: vercor-distributions
          path: dist/

  installed-artifact-tests:
    needs: build-artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        environment: [base, jcm, veros]
        include:
          - environment: base
            extra: ""
            pytest-target: "tests/test_setup_boundaries.py tests/test_distribution_boundaries.py tests/test_plugin_architecture.py"
          - environment: jcm
            extra: "[jcm]"
            pytest-target: "tests/test_setup_lifecycle_helpers.py tests/test_external_components_coverage.py -k jax_gcm"
          - environment: veros
            extra: "[veros]"
            pytest-target: "tests/test_external_components_coverage.py -k veros"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: vercor-distributions
          path: dist/
      - name: Install selected artifact environment
        run: |
          python -m pip install --upgrade pip pytest mypy
          WHEEL_PATH=$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.whl')))" )
          python -m pip install "${WHEEL_PATH}${{ matrix.extra }}"
          python -m pip install --no-deps tests/fixtures/public_plugin
      - name: Verify imports resolve from the installed wheel
        run: |
          cd "$RUNNER_TEMP"
          python -c "import pathlib, vercor; assert pathlib.Path(vercor.__file__).is_relative_to(pathlib.Path('${{ env.pythonLocation }}'))"
      - name: Run external public-plugin fixture
        run: |
          cd "$RUNNER_TEMP"
          python -m vercor_public_plugin.smoke --output-dir "$RUNNER_TEMP/plugin-output"
      - name: Type-check external public-plugin fixture
        run: mypy --strict tests/fixtures/public_plugin/src tests/fixtures/public_plugin/use_site.py
      - name: Run relevant installed-artifact suite
        env:
          PYTHONSAFEPATH: "1"
        run: python -P -m pytest --import-mode=importlib ${{ matrix.pytest-target }} -q --tb=short
