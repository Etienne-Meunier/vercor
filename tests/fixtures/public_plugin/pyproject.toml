[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[project]
name = "vercor-public-plugin"
version = "0.1.0"
description = "Installed-artifact fixture for VerCOR public extension contracts"
requires-python = ">=3.12"
dependencies = ["vercor>=4,<5"]

[tool.flit.module]
name = "vercor_public_plugin"

[tool.mypy]
strict = true
