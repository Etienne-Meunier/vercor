[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[project]
name = "vercor-compat-plugin-3-0"
version = "0.1.0"
description = "Frozen installed-artifact fixture for VerCOR 3.0 public contracts"
requires-python = ">=3.12"
dependencies = ["vercor>=3.0,<4"]

[tool.flit.module]
name = "vercor_compat_plugin_3_0"

[tool.mypy]
strict = true
